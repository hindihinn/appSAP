services:
  api:
    build: ./api
    container_name: appsap-api
    restart: always
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=Itsapcpka25
      - DB_NAME=fleet_management
      - DB_PORT=3310
      - JWT_SECRET=fleet_management_secret_key_2026_sap
      - JWT_EXPIRES_IN=7d
      - PORT=5000
      - UPLOAD_DIR=./uploads
    ports:
      - "1200:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api/uploads:/app/uploads

  web:
    build: ./web
    container_name: appsap-web
    restart: always
    environment:
      - VITE_API_URL=http://api:5000
    ports:
      - "1300:1300"
    depends_on:
      - api

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: appsap-phpmyadmin
    restart: always
    ports:
      - "8085:80"
    environment:
      - PMA_HOST=host.docker.internal
      - PMA_PORT=3310
      - PMA_USER=root
      - PMA_PASSWORD=Itsapcpka25
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  api_uploads:
