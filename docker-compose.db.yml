services:
  db:
    image: mysql:8.0
    container_name: appsap-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Itsapcpka25}
      MYSQL_DATABASE: ${DB_NAME:-fleet_management}
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=128M
    ports:
      - "${DB_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./fleet_management.sql:/docker-entrypoint-initdb.d/fleet_management.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_PASSWORD:-Itsapcpka25} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build: ./api
    container_name: appsap-api
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Itsapcpka25}
      - DB_NAME=${DB_NAME:-fleet_management}
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET:-fleet_management_secret_key_2026_sap}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - PORT=5000
      - UPLOAD_DIR=./uploads
    ports:
      - "${API_PORT:-1200}:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/uploads:/app/uploads

  web:
    build: ./web
    container_name: appsap-web
    restart: always
    environment:
      - VITE_API_URL=http://api:5000
    ports:
      - "${WEB_PORT:-1300}:1300"
    depends_on:
      - api

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: appsap-phpmyadmin
    restart: always
    ports:
      - "${PMA_PORT:-8085}:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=${DB_USER:-root}
      - PMA_PASSWORD=${DB_PASSWORD:-Itsapcpka25}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
